<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="1200" height="900" fill="#f8f9fa" />
  
  <!-- 标题 -->
  <text x="600" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#333">低代码平台架构思维导图</text>
  
  <!-- 主节点 -->
  <ellipse cx="600" cy="150" rx="120" ry="50" fill="#4285f4" />
  <text x="600" y="155" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">低代码平台</text>
  
  <!-- 连接线 -->
  <line x1="600" y1="200" x2="300" y2="250" stroke="#333" stroke-width="2" />
  <line x1="600" y1="200" x2="600" y2="250" stroke="#333" stroke-width="2" />
  <line x1="600" y1="200" x2="900" y2="250" stroke="#333" stroke-width="2" />
  <line x1="600" y1="200" x2="1100" y2="250" stroke="#333" stroke-width="2" />
  
  <!-- 一级节点：组件系统 -->
  <rect x="200" y="250" width="200" height="60" rx="10" ry="10" fill="#ea4335" />
  <text x="300" y="285" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">组件系统</text>
  
  <!-- 组件系统子节点连接线 -->
  <line x1="300" y1="310" x2="200" y2="350" stroke="#333" stroke-width="2" />
  <line x1="300" y1="310" x2="300" y2="350" stroke="#333" stroke-width="2" />
  <line x1="300" y1="310" x2="400" y2="350" stroke="#333" stroke-width="2" />
  
  <!-- 组件系统子节点 -->
  <rect x="150" y="350" width="100" height="40" rx="5" ry="5" fill="#f6c7c6" stroke="#ea4335" stroke-width="1" />
  <text x="200" y="375" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">容器组件</text>
  
  <rect x="250" y="350" width="100" height="40" rx="5" ry="5" fill="#f6c7c6" stroke="#ea4335" stroke-width="1" />
  <text x="300" y="375" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">内容组件</text>
  
  <rect x="350" y="350" width="100" height="40" rx="5" ry="5" fill="#f6c7c6" stroke="#ea4335" stroke-width="1" />
  <text x="400" y="375" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">布局组件</text>
  
  <!-- 组件系统详细说明 -->
  <rect x="150" y="400" width="300" height="120" rx="5" ry="5" fill="#f8f9fa" stroke="#ddd" stroke-width="1" />
  <text x="160" y="420" font-family="Arial, sans-serif" font-size="12" fill="#333">• 容器组件(container.vue): 可包含其他组件</text>
  <text x="160" y="445" font-family="Arial, sans-serif" font-size="12" fill="#333">• 内容组件(content-item.vue): 可放置UI组件</text>
  <text x="160" y="470" font-family="Arial, sans-serif" font-size="12" fill="#333">• 布局组件(block.vue): 提供布局结构</text>
  <text x="160" y="495" font-family="Arial, sans-serif" font-size="12" fill="#333">• 组件支持拖拽、嵌套和属性配置</text>
  
  <!-- 一级节点：拖拽交互 -->
  <rect x="500" y="250" width="200" height="60" rx="10" ry="10" fill="#fbbc05" />
  <text x="600" y="285" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">拖拽交互</text>
  
  <!-- 拖拽交互子节点连接线 -->
  <line x1="600" y1="310" x2="500" y2="350" stroke="#333" stroke-width="2" />
  <line x1="600" y1="310" x2="600" y2="350" stroke="#333" stroke-width="2" />
  <line x1="600" y1="310" x2="700" y2="350" stroke="#333" stroke-width="2" />
  
  <!-- 拖拽交互子节点 -->
  <rect x="450" y="350" width="100" height="40" rx="5" ry="5" fill="#feefc3" stroke="#fbbc05" stroke-width="1" />
  <text x="500" y="375" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">拖拽状态</text>
  
  <rect x="550" y="350" width="100" height="40" rx="5" ry="5" fill="#feefc3" stroke="#fbbc05" stroke-width="1" />
  <text x="600" y="375" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">放置逻辑</text>
  
  <rect x="650" y="350" width="100" height="40" rx="5" ry="5" fill="#feefc3" stroke="#fbbc05" stroke-width="1" />
  <text x="700" y="375" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">交互反馈</text>
  
  <!-- 拖拽交互详细说明 -->
  <rect x="450" y="400" width="300" height="120" rx="5" ry="5" fill="#f8f9fa" stroke="#ddd" stroke-width="1" />
  <text x="460" y="420" font-family="Arial, sans-serif" font-size="12" fill="#333">• dragStore: 管理拖拽状态和类型</text>
  <text x="460" y="445" font-family="Arial, sans-serif" font-size="12" fill="#333">• 拖拽事件: dragstart, dragover, drop</text>
  <text x="460" y="470" font-family="Arial, sans-serif" font-size="12" fill="#333">• 组件交换: 支持组件间位置交换</text>
  <text x="460" y="495" font-family="Arial, sans-serif" font-size="12" fill="#333">• 视觉反馈: 拖拽时的边框和背景变化</text>
  
  <!-- 一级节点：编辑器功能 -->
  <rect x="800" y="250" width="200" height="60" rx="10" ry="10" fill="#34a853" />
  <text x="900" y="285" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">编辑器功能</text>
  
  <!-- 编辑器功能子节点连接线 -->
  <line x1="900" y1="310" x2="800" y2="350" stroke="#333" stroke-width="2" />
  <line x1="900" y1="310" x2="900" y2="350" stroke="#333" stroke-width="2" />
  <line x1="900" y1="310" x2="1000" y2="350" stroke="#333" stroke-width="2" />
  
  <!-- 编辑器功能子节点 -->
  <rect x="750" y="350" width="100" height="40" rx="5" ry="5" fill="#ceead6" stroke="#34a853" stroke-width="1" />
  <text x="800" y="375" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">组件选择</text>
  
  <rect x="850" y="350" width="100" height="40" rx="5" ry="5" fill="#ceead6" stroke="#34a853" stroke-width="1" />
  <text x="900" y="375" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">属性编辑</text>
  
  <rect x="950" y="350" width="100" height="40" rx="5" ry="5" fill="#ceead6" stroke="#34a853" stroke-width="1" />
  <text x="1000" y="375" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">预览模式</text>
  
  <!-- 编辑器功能详细说明 -->
  <rect x="750" y="400" width="300" height="120" rx="5" ry="5" fill="#f8f9fa" stroke="#ddd" stroke-width="1" />
  <text x="760" y="420" font-family="Arial, sans-serif" font-size="12" fill="#333">• 组件选择: 点击激活当前组件</text>
  <text x="760" y="445" font-family="Arial, sans-serif" font-size="12" fill="#333">• 属性面板: 编辑组件样式和行为</text>
  <text x="760" y="470" font-family="Arial, sans-serif" font-size="12" fill="#333">• 预览/查看模式: 切换编辑和预览状态</text>
  <text x="760" y="495" font-family="Arial, sans-serif" font-size="12" fill="#333">• 组件删除: 支持删除已添加的组件</text>
  
  <!-- 一级节点：数据流 -->
  <rect x="1000" y="250" width="200" height="60" rx="10" ry="10" fill="#673ab7" />
  <text x="1100" y="285" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">数据流</text>
  
  <!-- 数据流子节点连接线 -->
  <line x1="1100" y1="310" x2="1000" y2="350" stroke="#333" stroke-width="2" />
  <line x1="1100" y1="310" x2="1100" y2="350" stroke="#333" stroke-width="2" />
  <line x1="1100" y1="310" x2="1200" y2="350" stroke="#333" stroke-width="2" />
  
  <!-- 数据流子节点 -->
  <rect x="950" y="350" width="100" height="40" rx="5" ry="5" fill="#d1c4e9" stroke="#673ab7" stroke-width="1" />
  <text x="1000" y="375" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">组件数据</text>
  
  <rect x="1050" y="350" width="100" height="40" rx="5" ry="5" fill="#d1c4e9" stroke="#673ab7" stroke-width="1" />
  <text x="1100" y="375" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">事件传递</text>
  
  <rect x="1150" y="350" width="100" height="40" rx="5" ry="5" fill="#d1c4e9" stroke="#673ab7" stroke-width="1" />
  <text x="1200" y="375" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">状态管理</text>
  
  <!-- 数据流详细说明 -->
  <rect x="950" y="400" width="300" height="120" rx="5" ry="5" fill="#f8f9fa" stroke="#ddd" stroke-width="1" />
  <text x="960" y="420" font-family="Arial, sans-serif" font-size="12" fill="#333">• 组件数据: props传递配置和状态</text>
  <text x="960" y="445" font-family="Arial, sans-serif" font-size="12" fill="#333">• 事件: click, delete, resize等事件</text>
  <text x="960" y="470" font-family="Arial, sans-serif" font-size="12" fill="#333">• 组件树: 父子组件嵌套关系管理</text>
  <text x="960" y="495" font-family="Arial, sans-serif" font-size="12" fill="#333">• 状态同步: 编辑状态与预览状态同步</text>
  
  <!-- 工作流程图 -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">低代码平台工作流程</text>
  
  <!-- 流程图背景 -->
  <rect x="200" y="580" width="800" height="250" rx="10" ry="10" fill="#f8f9fa" stroke="#ddd" stroke-width="2" />
  
  <!-- 流程节点 -->
  <rect x="250" y="620" width="120" height="60" rx="10" ry="10" fill="#4285f4" />
  <text x="310" y="655" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">组件选择</text>
  
  <rect x="450" y="620" width="120" height="60" rx="10" ry="10" fill="#ea4335" />
  <text x="510" y="655" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">拖拽放置</text>
  
  <rect x="650" y="620" width="120" height="60" rx="10" ry="10" fill="#fbbc05" />
  <text x="710" y="655" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">属性配置</text>
  
  <rect x="850" y="620" width="120" height="60" rx="10" ry="10" fill="#34a853" />
  <text x="910" y="655" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">预览/发布</text>
  
  <!-- 流程连接箭头 -->
  <line x1="370" y1="650" x2="450" y2="650" stroke="#333" stroke-width="2" />
  <polygon points="445,645 455,650 445,655" fill="#333" />
  
  <line x1="570" y1="650" x2="650" y2="650" stroke="#333" stroke-width="2" />
  <polygon points="645,645 655,650 645,655" fill="#333" />
  
  <line x1="770" y1="650" x2="850" y2="650" stroke="#333" stroke-width="2" />
  <polygon points="845,645 855,650 845,655" fill="#333" />
  
  <!-- 流程说明 -->
  <text x="310" y="700" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">从组件库中选择</text>
  <text x="310" y="715" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">所需的组件</text>
  
  <text x="510" y="700" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">拖拽组件到画布</text>
  <text x="510" y="715" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">进行布局排列</text>
  
  <text x="710" y="700" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">设置组件属性</text>
  <text x="710" y="715" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">样式和行为</text>
  
  <text x="910" y="700" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">预览效果并</text>
  <text x="910" y="715" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">发布应用</text>
  
  <!-- 循环箭头 -->
  <path d="M910,730 C910,760 310,760 310,730" stroke="#333" stroke-width="2" fill="none" />
  <polygon points="315,735 305,730 315,725" fill="#333" />
  <text x="600" y="780" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">迭代优化设计</text>
  
  <!-- 页脚 -->
  <text x="600" y="850" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">© 低代码平台架构思维导图</text>
</svg>