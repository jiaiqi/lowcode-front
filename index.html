<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" href="./favicon.ico">
  <!-- 全局环境配置（百度地图/视频/聊天等） -->
  <script src="./config/config_dev.js"></script>
  <!-- 生产网关配置注入：服务器根目录公共 /js/server.js（部署根目录/子目录均解析到站点根/js/）；dev 由 vite proxy 代理 -->
  <script src="../js/server.js"></script>
  <title>低代码页面</title>
  <style>
    /* ===== 首屏骨架屏（Vue 挂载后自动被替换；低调精致：柔和渐变 + 微光晕 + 浅色细字） ===== */
    html, body { margin: 0; padding: 0; }
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
      z-index: 9999;
    }
    #app-loading .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(126, 166, 242, 0.16);
      border-top-color: #7ea6f2;
      border-radius: 50%;
      animation: lc-spin 0.9s linear infinite;
    }
    #app-loading .text {
      margin-top: 14px;
      font-size: 12px;
      font-weight: 300;
      color: #b8bfc9;
      letter-spacing: 3px;
    }
    @keyframes lc-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <noscript>
    <strong>请启用 JavaScript 后访问本页面。</strong>
  </noscript>
  <div id="app">
    <div id="app-loading">
      <div class="spinner"></div>
      <div class="text">页面加载中...</div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
