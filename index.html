<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" href="./favicon.ico">
  <!-- 全局环境配置（百度地图/视频/聊天等） -->
  <script src="./config/config_dev.js"></script>
  <!-- 生产网关配置注入：服务器根目录公共 /js/server.js（部署根目录/子目录均解析到站点根/js/）；dev 由 vite proxy 代理 -->
  <script src="../js/server.js"></script>
  <title>低代码页面</title>
  <style>
    /* ===== 首屏骨架屏（Vue 挂载后自动被替换；低调精致：柔和渐变 + 微光晕 + 浅色细字） ===== */
    html, body { margin: 0; padding: 0; }
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
      z-index: 9999;
    }
    #app-loading .brand {
      font-size: 15px;
      font-weight: 300;
      letter-spacing: 8px;
      text-indent: 8px; /* 抵消末字间距，保持视觉居中 */
      color: #7a8aa0;
      animation: lc-fade-up 1s ease-out both;
    }
    #app-loading .bar {
      width: 60px;
      height: 2px;
      margin-top: 18px;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, #7ea6f2, transparent);
      background-size: 200% 100%;
      animation: lc-sweep 1.8s ease-in-out infinite;
    }
    @keyframes lc-fade-up {
      from { opacity: 0; transform: translateY(10px); filter: blur(3px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    @keyframes lc-sweep {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>

<body>
  <noscript>
    <strong>请启用 JavaScript 后访问本页面。</strong>
  </noscript>
  <div id="app">
    <div id="app-loading">
      <div class="brand">智慧园区</div>
      <div class="bar"></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
