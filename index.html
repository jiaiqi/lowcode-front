<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" href="./favicon.ico">
  <!-- 全局环境配置（百度地图/视频/聊天等） -->
  <script src="./config/config_dev.js"></script>
  <!-- 生产网关配置注入：服务器根目录公共 /js/server.js（部署根目录/子目录均解析到站点根/js/）；dev 由 vite proxy 代理 -->
  <script src="../js/server.js"></script>
  <title>低代码页面</title>
  <style>
    /* ===== 首屏骨架屏（Vue 挂载后自动被替换） ===== */
    html, body { margin: 0; padding: 0; }
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f5f7fa;
      z-index: 9999;
    }
    #app-loading .logo {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      background: linear-gradient(135deg, #409eff, #17d57e);
      animation: lc-pulse 1.2s ease-in-out infinite;
    }
    #app-loading .text {
      margin-top: 16px;
      font-size: 14px;
      color: #909399;
      letter-spacing: 1px;
    }
    @keyframes lc-pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.92); }
      50% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>

<body>
  <noscript>
    <strong>请启用 JavaScript 后访问本页面。</strong>
  </noscript>
  <div id="app">
    <div id="app-loading">
      <div class="logo"></div>
      <div class="text">页面加载中...</div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
